# Checks only: this workflow never deploys and holds no secrets.
# Database deployment stays a deliberate, manual step (docs/backend/supabase-workflow.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Builds without any Supabase settings on purpose: the Phase 1 pages
      # read mock data and must not depend on a database yet.
      - run: npm run build

  database:
    name: Database — reset from scratch, tests, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the "supabase" devDependency in package.json.
          version: 2.120.0
      - name: Start the local database
        run: supabase db start
      - name: Rebuild it from the migrations and the seed
        run: supabase db reset
      - name: Database tests (pgTAP)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee "$RUNNER_TEMP/pgtap.txt"
      - name: pgTAP failures as annotations
        # The job log needs a GitHub session; the failing lines (fictional seed
        # data only) are also published as a notice, readable without one.
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/pgtap.txt" || exit 0
          encode() { tr -d '\015' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          grep -E -A3 "not ok|ERROR|Failed|Looks like|Result:|\.sql \.\." "$RUNNER_TEMP/pgtap.txt" | head -c 3500 > "$RUNNER_TEMP/pgtap-failures.txt" || true
          echo "::notice title=pgTAP failures::$(encode < "$RUNNER_TEMP/pgtap-failures.txt")"
      - name: Registration concurrency (parallel sessions)
        # Twenty real sessions race for one seat; two cancel at once (Phase 7).
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL // .db_url // empty')
          test -n "$DB_URL"
          bash supabase/tests/concurrency/registrations.sh "$DB_URL"
      - name: Application concurrency (parallel sessions)
        # Five tabs start and submit at once; ten students race the limit (Phase 8).
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL // .db_url // empty')
          test -n "$DB_URL"
          bash supabase/tests/concurrency/applications.sh "$DB_URL"
      - name: Review concurrency (parallel sessions)
        # One slot, opposite proposals, one place, a double release, five tabs accepting (Phase 9).
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL // .db_url // empty')
          test -n "$DB_URL"
          bash supabase/tests/concurrency/review.sh "$DB_URL"
      - name: Database lint (plpgsql_check)
        # Findings are also published as a notice (the job log needs a GitHub session).
        run: |
          encode() { tr -d '\015' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          if ! supabase db lint --fail-on error > "$RUNNER_TEMP/lint.txt" 2>&1; then
            cat "$RUNNER_TEMP/lint.txt"
            # Errors only (warnings would push them out of the notice).
            sed -n '/^\[/,$p' "$RUNNER_TEMP/lint.txt" \
              | jq -c '.[] | {function, errors: [.issues[] | select(.level == "error") | {message, detail, line: .statement.lineNumber, context}]} | select(.errors | length > 0)' \
              > "$RUNNER_TEMP/lint-errors.txt" || head -c 6000 "$RUNNER_TEMP/lint.txt" > "$RUNNER_TEMP/lint-errors.txt"
            echo "::notice title=Database lint errors::$(head -c 20000 "$RUNNER_TEMP/lint-errors.txt" | encode)"
            exit 1
          fi
          cat "$RUNNER_TEMP/lint.txt"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated types match the migrations
        # Compares the Database types structurally, not the file text: the local
        # generator (npm run db:types) and the hosted one (db:types:linked)
        # format the same schema differently. Any difference is listed entry by
        # entry, in annotations short enough to be read whole.
        run: |
          supabase gen types --lang typescript --local --schema public > "$RUNNER_TEMP/generated.ts"
          if ! node scripts/compare-db-types.mjs src/types/database.types.ts "$RUNNER_TEMP/generated.ts" > "$RUNNER_TEMP/types-diff.txt"; then
            cat "$RUNNER_TEMP/types-diff.txt"
            encode() { tr -d '\015' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
            echo "::error file=src/types/database.types.ts::src/types/database.types.ts does not match the migrations. Run npm run db:types (or db:types:linked) and commit the result. Differences follow in notices."
            split -b 3500 -d "$RUNNER_TEMP/types-diff.txt" "$RUNNER_TEMP/types-diff-part-"
            for part in $(ls "$RUNNER_TEMP"/types-diff-part-* | head -n 9); do
              echo "::notice title=Type differences ($(basename "$part"))::$(encode < "$part")"
            done
            exit 1
          fi

  e2e:
    name: End-to-end — sign-in, onboarding, profile, MFA (local stack)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Throwaway password of a fictional account on this job's local stack only.
      E2E_TEST_ACCOUNT_PASSWORD: local-stack-only-e2e-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the "supabase" devDependency in package.json.
          version: 2.120.0
      - run: npm ci
      - name: Start the local Supabase stack (auth, storage, mail catcher)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime
      - name: Point the app at the local stack
        # Local-stack values only (fixed demo keys of the CLI), never a hosted project.
        run: |
          supabase status -o json > "$RUNNER_TEMP/status.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/status.json")"
          API_URL=$(jq -r '.API_URL // .api_url // empty' "$RUNNER_TEMP/status.json")
          KEY=$(jq -r '.PUBLISHABLE_KEY // .publishable_key // .ANON_KEY // .anon_key // empty' "$RUNNER_TEMP/status.json")
          test -n "$API_URL" && test -n "$KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$KEY" > .env.local
      - name: Fictional test account and the development test-account sign-in
        # Same script as for the hosted development project (docs/backend/authentication.md).
        run: |
          DB_URL=$(jq -r '.DB_URL // .db_url // empty' "$RUNNER_TEMP/status.json")
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v email=e2e.membre@comptes.example.test -v password="$E2E_TEST_ACCOUNT_PASSWORD" \
            -v first_name=Test -v last_name=Membre -v "display_name=Compte test · Membre" -v onboarded=true \
            -f supabase/dev/create-test-account.sql | tee "$RUNNER_TEMP/test-account.txt"
          grep -q "e2e.membre@comptes.example.test" "$RUNNER_TEMP/test-account.txt"
          echo "AUTH_TEST_ACCOUNTS=on" >> .env.local
      - run: npm run db:check
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3020 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3020/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/next.log"; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Test counts
        if: always()
        run: |
          if [ -f playwright-report.json ]; then
            echo "::notice title=Playwright::$(jq -r '.stats | "passed \(.expected), skipped \(.skipped), failed \(.unexpected), flaky \(.flaky)"' playwright-report.json)"
          fi
      - name: App and Auth logs on failure
        if: failure()
        # Also as annotations, readable without signing in (local stack only: no real data or secret).
        run: |
          tail -n 200 "$RUNNER_TEMP/next.log" || true
          encode() { tr -d '\015' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          echo "::notice title=App log (tail)::$(tail -n 60 "$RUNNER_TEMP/next.log" | head -c 20000 | encode)"
          AUTH=$(docker ps --format '{{.Names}}' | grep -m1 '^supabase_auth_' || true)
          if [ -n "$AUTH" ]; then echo "::notice title=Auth log (tail)::$(docker logs --tail 40 "$AUTH" 2>&1 | head -c 20000 | encode)"; fi
