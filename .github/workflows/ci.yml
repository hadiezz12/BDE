# Checks only: this workflow never deploys and holds no secrets.
# Database deployment stays a deliberate, manual step (docs/backend/supabase-workflow.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Builds without any Supabase settings on purpose: the Phase 1 pages
      # read mock data and must not depend on a database yet.
      - run: npm run build

  database:
    name: Database — reset from scratch, tests, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the "supabase" devDependency in package.json.
          version: 2.120.0
      - name: Start the local database
        run: supabase db start
      - name: Rebuild it from the migrations and the seed
        run: supabase db reset
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: Database lint (plpgsql_check)
        run: supabase db lint --fail-on error
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generated types match the migrations
        # Compares the Database types, not the file text: the local generator
        # (npm run db:types) and the hosted one (db:types:linked) format the
        # same schema differently. __InternalSupabase only names the API version.
        run: |
          supabase gen types --lang typescript --local --schema public > "$RUNNER_TEMP/generated.ts"
          cp src/types/database.types.ts "$RUNNER_TEMP/committed.ts"
          cat > "$RUNNER_TEMP/compare.ts" <<'EOF'
          import type { Database as Committed } from "./committed";
          import type { Database as Generated } from "./generated";
          type Schema<T> = Omit<T, "__InternalSupabase">;
          type Same<A, B> = (<T>() => T extends A ? 1 : 2) extends (<T>() => T extends B ? 1 : 2) ? true : false;
          export const sameSchema: Same<Schema<Committed>, Schema<Generated>> = true;
          EOF
          cd "$RUNNER_TEMP"
          # Keep the TypeScript version in step with package-lock.json.
          if ! npx --yes -p typescript@5.9.3 tsc --noEmit --strict --skipLibCheck --module esnext --moduleResolution bundler --target es2022 compare.ts; then
            echo "::error file=src/types/database.types.ts::src/types/database.types.ts does not match the migrations. Run npm run db:types (or db:types:linked) and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end — sign-in, onboarding, profile, MFA (local stack)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the "supabase" devDependency in package.json.
          version: 2.120.0
      - run: npm ci
      - name: Start the local Supabase stack (auth, storage, mail catcher)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime
      - name: Point the app at the local stack
        # Local-stack values only (fixed demo keys of the CLI), never a hosted project.
        run: |
          supabase status -o json > "$RUNNER_TEMP/status.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/status.json")"
          API_URL=$(jq -r '.API_URL // .api_url // empty' "$RUNNER_TEMP/status.json")
          KEY=$(jq -r '.PUBLISHABLE_KEY // .publishable_key // .ANON_KEY // .anon_key // empty' "$RUNNER_TEMP/status.json")
          test -n "$API_URL" && test -n "$KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$KEY" > .env.local
      - run: npm run db:check
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3020 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3020/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/next.log"; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: App log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/next.log" || true
