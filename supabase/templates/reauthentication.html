<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme que c'est bien toi</title>
  </head>
  <!-- Code asked before a sensitive account change (Supabase "reauthentication"). -->
  <body style="margin:0;padding:0;background:#f4efe6;font-family:Arial,Helvetica,sans-serif;color:#141216;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:2px solid #141216;">
            <tr>
              <td style="background:#141216;padding:18px 24px;">
                <span style="font-size:15px;font-weight:900;letter-spacing:3px;color:#ff2d95;">VERY PINK CLUB</span><br />
                <span style="font-size:11px;letter-spacing:2px;color:#cfc8d6;">BDE · GEM ALPINE BUSINESS SCHOOL</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Pour confirmer une modification de ton compte, entre ce code&nbsp;:</p>
                <p style="margin:0 0 20px;font-size:34px;font-weight:700;letter-spacing:8px;font-family:'Courier New',Courier,monospace;">{{ .Token }}</p>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#4a4450;">Si ce n'est pas toi, ne fais rien et préviens le bureau&nbsp;: ton compte reste tel quel.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 24px;border-top:1px solid #e3ddd3;font-size:12px;color:#6d6673;">
                Very Pink Club — le bureau des étudiants de GEM Alpine Business School, Paris.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
