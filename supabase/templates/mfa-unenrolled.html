<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Double authentification retirée</title>
  </head>
  <!-- Security notification: a second factor was removed from the account. -->
  <body style="margin:0;padding:0;background:#f4efe6;font-family:Arial,Helvetica,sans-serif;color:#141216;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:2px solid #141216;">
            <tr>
              <td style="background:#141216;padding:18px 24px;">
                <span style="font-size:15px;font-weight:900;letter-spacing:3px;color:#ff2d95;">VERY PINK CLUB</span><br />
                <span style="font-size:11px;letter-spacing:2px;color:#cfc8d6;">BDE · GEM ALPINE BUSINESS SCHOOL</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 24px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Une application d'authentification a été retirée de ton compte.</p>
                <p style="margin:0;font-size:14px;line-height:1.5;color:#4a4450;">Ce n'est pas toi&nbsp;? Préviens le bureau tout de suite et reconnecte-toi pour réactiver la double authentification.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
